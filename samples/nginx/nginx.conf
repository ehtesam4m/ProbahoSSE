events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Generic upstream — docker-compose assigns aliases "api-1" and "api-2"
    # to whichever API services are running (PubSub or Stream).
    upstream api {
        server api-1:8080;
        server api-2:8080;
    }

    server {
        listen 8080;
        server_name _;

        # Serve the HTML demo
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # Health & info endpoints — exact matches take priority
        location = /health {
            proxy_pass http://api;
            proxy_set_header Host $host;
        }

        location = /info {
            proxy_pass http://api;
            proxy_set_header Host $host;
        }

        # SSE endpoint — buffering must be off for streaming
        location /sse {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # Forward Last-Event-ID for Stream replay support
            proxy_set_header Last-Event-ID $http_last_event_id;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            chunked_transfer_encoding on;
        }

        # Health & info — no longer needed as regex block
    }
}
